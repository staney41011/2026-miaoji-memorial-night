<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>海浪指揮｜節目背板（動畫加強版）</title>
<style>
:root{--bg1:#07182d;--bg2:#0b3b62;--ink:#f7fbff;--muted:#b8d8ea;--cyan:#79e7ff;--cyan2:#5bbcff;--gold:#ffe3a6;--panel:rgba(4,20,38,.74)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061323;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}body{position:relative}
.ocean{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1100px 700px at 20% -10%,rgba(100,220,255,.20),transparent 60%),radial-gradient(900px 700px at 100% 30%,rgba(55,132,255,.17),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}.ocean:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 20% 20%,rgba(116,242,255,.14),transparent 25%),radial-gradient(circle at 80% 35%,rgba(124,187,255,.10),transparent 30%),radial-gradient(circle at 50% 100%,rgba(38,150,255,.10),transparent 34%);filter:blur(20px);animation:ambientDrift 16s ease-in-out infinite alternate}.ocean:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.28) 100%);pointer-events:none}@keyframes ambientDrift{from{transform:translate3d(-2vw,-1vh,0) scale(1)}to{transform:translate3d(2vw,1.5vh,0) scale(1.05)}}
.lights{position:absolute;inset:0;pointer-events:none;overflow:hidden}.beam{position:absolute;top:-18vh;width:18vw;height:72vh;border-radius:50%;filter:blur(18px);opacity:.16;transform-origin:50% 0;background:linear-gradient(180deg,rgba(140,241,255,.45),rgba(140,241,255,0));mix-blend-mode:screen}.beam.b1{left:8%;transform:rotate(-18deg);animation:sway1 8s ease-in-out infinite alternate}.beam.b2{right:14%;transform:rotate(17deg);animation:sway2 9s ease-in-out infinite alternate}.beam.b3{left:45%;top:-24vh;width:14vw;opacity:.12;transform:rotate(-4deg);animation:sway3 11s ease-in-out infinite alternate}@keyframes sway1{from{transform:rotate(-22deg) translateX(-1vw)}to{transform:rotate(-12deg) translateX(2vw)}}@keyframes sway2{from{transform:rotate(12deg) translateX(1vw)}to{transform:rotate(22deg) translateX(-2vw)}}@keyframes sway3{from{transform:rotate(-7deg) translateX(-1vw)}to{transform:rotate(4deg) translateX(1vw)}}
.particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;bottom:-5vh;width:6px;height:6px;border-radius:999px;background:rgba(190,245,255,.75);box-shadow:0 0 14px rgba(140,228,255,.65);opacity:0;animation:floatUp linear infinite}@keyframes floatUp{0%{transform:translate3d(0,0,0) scale(.6);opacity:0}12%{opacity:.85}88%{opacity:.35}100%{transform:translate3d(var(--dx),-115vh,0) scale(1.25);opacity:0}}
.wave{position:absolute;left:-15vw;width:130vw;height:18vh;border-radius:50%;border:2px solid rgba(129,234,255,.20);filter:drop-shadow(0 0 12px rgba(80,205,255,.08));transform:rotate(-2deg)}.wave.w1{bottom:13vh;animation:drift 9s ease-in-out infinite alternate}.wave.w2{bottom:4vh;opacity:.55;animation:drift2 11s ease-in-out infinite alternate}.wave.w3{bottom:-5vh;opacity:.3;animation:drift 13s ease-in-out infinite alternate-reverse}.waveGlow{position:absolute;left:-10vw;bottom:1vh;width:120vw;height:28vh;border-radius:50%;background:radial-gradient(ellipse at center,rgba(87,205,255,.16),transparent 60%);filter:blur(22px);animation:tide 9s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(-2vw) rotate(-2deg) scaleY(.8)}to{transform:translateX(3vw) rotate(1deg) scaleY(1.1)}}@keyframes drift2{from{transform:translateX(2vw) rotate(1deg) scaleY(1)}to{transform:translateX(-3vw) rotate(-1deg) scaleY(.8)}}@keyframes tide{from{transform:translateY(1.5vh) scale(1)}to{transform:translateY(-1vh) scale(1.04)}}
#app{position:relative;z-index:2;width:100%;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,3vw,52px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:.12em;color:var(--muted);font-size:clamp(15px,1.4vw,24px)}.dot{width:14px;height:14px;border-radius:999px;background:var(--cyan);box-shadow:0 0 18px rgba(121,231,255,.8);animation:dotPulse 2.1s ease-in-out infinite}@keyframes dotPulse{0%,100%{transform:scale(1);box-shadow:0 0 18px rgba(121,231,255,.8)}50%{transform:scale(1.18);box-shadow:0 0 28px rgba(121,231,255,1)}}.modeTag{padding:8px 14px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.06);font-size:clamp(13px,1.15vw,18px);letter-spacing:.1em;color:#dff7ff;backdrop-filter:blur(8px)}
main{display:flex;align-items:center;justify-content:center;text-align:center;min-height:0;position:relative}.screen{width:min(1480px,94vw);display:none}.screen.active{display:block}.eyebrow{font-size:clamp(18px,2vw,34px);font-weight:800;letter-spacing:.22em;color:var(--cyan);margin-bottom:clamp(18px,2vh,30px);opacity:0;transform:translateY(16px)}.practiceText{font-size:clamp(34px,5.1vw,82px);line-height:1.34;font-weight:900;letter-spacing:.03em;text-wrap:balance;text-shadow:0 5px 28px rgba(0,0,0,.25);opacity:0;transform:translateY(22px) scale(.98)}.practiceText .accent{color:var(--gold)}.sub{margin-top:clamp(18px,2vh,28px);font-size:clamp(17px,1.8vw,30px);color:var(--muted);font-weight:600;letter-spacing:.06em;opacity:0;transform:translateY(14px)}.screen.active .eyebrow{animation:revealUp .6s .02s cubic-bezier(.2,.8,.2,1) forwards}.screen.active .practiceText{animation:revealUp .76s .12s cubic-bezier(.2,.8,.2,1) forwards}.screen.active .sub{animation:revealUp .72s .24s cubic-bezier(.2,.8,.2,1) forwards}.screen.swap .eyebrow,.screen.swap .practiceText,.screen.swap .sub{animation:none}.screen.swap.active .eyebrow{animation:revealUp .54s .02s cubic-bezier(.2,.8,.2,1) forwards}.screen.swap.active .practiceText{animation:revealUp .65s .08s cubic-bezier(.2,.8,.2,1) forwards}.screen.swap.active .sub{animation:revealUp .58s .18s cubic-bezier(.2,.8,.2,1) forwards}@keyframes revealUp{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.formalWrap{display:grid;place-items:center;gap:26px;position:relative;min-height:55vh}.formalWrap:before{content:"";position:absolute;inset:auto 50% 12%;width:min(58vw,900px);height:min(58vw,900px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(97,222,255,.18),rgba(97,222,255,.04) 35%,transparent 65%);filter:blur(10px);animation:breathAura 4.6s ease-in-out infinite}@keyframes breathAura{0%,100%{transform:translateX(-50%) scale(1);opacity:.82}50%{transform:translateX(-50%) scale(1.06);opacity:1}}.cueStage{position:relative;display:grid;place-items:center;min-height:43vh;width:100%}.rippleLayer{position:absolute;inset:0;pointer-events:none;overflow:visible}.ripple{position:absolute;left:50%;top:52%;width:28vmin;height:28vmin;border-radius:50%;border:2px solid rgba(135,233,255,.48);transform:translate(-50%,-50%) scale(.25);opacity:0;animation:ripple 1.08s ease-out forwards}@keyframes ripple{0%{opacity:.85;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}}
.cue{font-size:clamp(130px,26vw,420px);line-height:.82;font-weight:1000;letter-spacing:-.05em;text-shadow:0 0 42px rgba(86,209,255,.24),0 12px 60px rgba(0,0,0,.35);transition:transform .18s ease,filter .18s ease,color .25s ease;position:relative;color:white;z-index:2}.cue.pulse{animation:cuePulse .42s cubic-bezier(.17,.89,.32,1.2)}.cue.shimmer{animation:cuePulse .42s cubic-bezier(.17,.89,.32,1.2),cueGlow 2.6s ease-in-out infinite}@keyframes cuePulse{0%{transform:scale(.82);filter:brightness(1.35)}55%{transform:scale(1.08)}100%{transform:scale(1);filter:brightness(1)}}@keyframes cueGlow{0%,100%{text-shadow:0 0 36px rgba(86,209,255,.24),0 12px 60px rgba(0,0,0,.35)}50%{text-shadow:0 0 60px rgba(130,238,255,.42),0 12px 60px rgba(0,0,0,.35)}}.cueName{font-size:clamp(26px,3vw,52px);font-weight:900;letter-spacing:.18em;color:#dff7ff;min-height:1.2em;opacity:.96;z-index:2}.cueHint{font-size:clamp(14px,1.25vw,22px);color:rgba(220,244,255,.78);letter-spacing:.1em;z-index:2}.cue[data-type="A"]{color:#8eeaff}.cue[data-type="B"]{color:#ffe7ad}.cue[data-type="S"]{color:#eef7ff;animation:cueGlow 2.6s ease-in-out infinite,hissBreath 1.9s ease-in-out infinite}.cue[data-type="AB"]{font-size:clamp(90px,19vw,300px);color:#fff}.cue[data-type="REST"]{font-size:clamp(80px,14vw,220px);color:#99b6c8}@keyframes hissBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.meter{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);width:min(54vw,900px);height:10px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;backdrop-filter:blur(6px)}.meter i{display:block;height:100%;width:30%;border-radius:999px;background:linear-gradient(90deg,rgba(95,191,255,.08),rgba(135,239,255,.95),rgba(95,191,255,.08));filter:blur(.2px);animation:meterRun 3.4s ease-in-out infinite}@keyframes meterRun{0%{transform:translateX(-110%)}50%{transform:translateX(235%)}100%{transform:translateX(-110%)}}
footer{display:flex;justify-content:space-between;align-items:end;gap:16px;color:rgba(225,245,255,.55);font-size:clamp(12px,1vw,16px)}.progress{display:flex;align-items:center;gap:10px}.bar{width:min(240px,28vw);height:5px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan2),var(--cyan));transition:width .4s ease}
#operator{position:fixed;z-index:10;right:18px;bottom:18px;width:min(430px,92vw);padding:16px;border-radius:18px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 50px rgba(0,0,0,.35);display:none}#operator.show{display:block}#operator h3{margin:0 0 12px;font-size:16px;color:#dff7ff}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}button{appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:800;cursor:pointer}button:hover{background:rgba(255,255,255,.14)}button.primary{background:rgba(77,196,255,.18);border-color:rgba(104,221,255,.42)}button.gold{background:rgba(255,219,146,.16);border-color:rgba(255,219,146,.35)}.keys{margin-top:10px;font-size:12px;line-height:1.7;color:#b8d8ea}kbd{padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);font-family:inherit;color:white}.flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;background:radial-gradient(circle at center,rgba(110,230,255,.22),transparent 54%)}.flash.on{animation:flash .4s ease}@keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}@media(max-width:700px){#app{padding:20px}.practiceText{font-size:clamp(30px,9vw,54px)}.cue{font-size:clamp(110px,42vw,260px)}.meter{width:min(78vw,520px)}}
</style>
</head>
<body>
<div class="ocean" aria-hidden="true"><div class="lights"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div></div><div class="particles" id="particles"></div><div class="waveGlow"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div><div class="flash" id="flash"></div>
<div id="app"><header><div class="brand"><span class="dot"></span><span>海浪共鳴・互動節目</span></div><div class="modeTag" id="modeTag">示範練習</div></header><main><section class="screen active" id="practiceScreen"><div class="eyebrow">示範練習</div><div class="practiceText" id="practiceText"></div><div class="sub" id="practiceSub"></div></section><section class="screen" id="formalScreen"><div class="formalWrap"><div class="eyebrow" style="opacity:1;transform:none;animation:none">正式節目｜請跟著指揮</div><div class="cueStage"><div class="rippleLayer" id="rippleLayer"></div><div class="cue shimmer" id="cue" data-type="REST">準備</div></div><div class="cueName" id="cueName">看指揮、聽海浪</div><div class="cueHint" id="cueHint">畫面僅顯示目前指示</div><div class="meter" aria-hidden="true"><i></i></div></div></section></main><footer><div class="progress" id="progressWrap"><span id="pageNo">1 / 14</span><span class="bar"><i id="progressBar"></i></span></div><div>按 <b>C</b> 顯示／隱藏控制台・按 <b>F</b> 全螢幕</div></footer></div>
<div id="operator"><h3>指揮控制台（觀眾看不到時可按 C 隱藏）</h3><div class="row"><button onclick="prevPractice()">← 上一則</button><button class="primary" onclick="nextPractice()">下一則 →</button><button class="gold" onclick="startFormal()">進入正式節目</button><button onclick="startPractice()">回示範練習</button></div><div class="row"><button class="primary" onclick="setCue('A')">A 塑膠袋</button><button class="gold" onclick="setCue('B')">B 紙張</button><button onclick="setCue('S')">嘶</button><button onclick="setCue('AB')">A＋B</button><button onclick="setCue('REST')">停／準備</button></div><div class="keys">快捷鍵：<kbd>←</kbd><kbd>→</kbd> 練習上一／下一則　<kbd>Enter</kbd> 正式節目　<kbd>A</kbd> / <kbd>B</kbd> / <kbd>S</kbd> 指示　<kbd>X</kbd> A+B　<kbd>Space</kbd> 停止／準備</div></div>
<script>
const practice=[{t:'現在請您打開您的道具',s:'示範人員出場'},{t:'拿到 <span class="accent">塑膠袋</span> 的您，指示代碼為 <span class="accent">A</span>，請您牢記。',s:'A＝塑膠袋'},{t:'現在請 <span class="accent">A</span> 跟著示範人員的動作，揉搓手上的塑膠袋。',s:'跟著示範人員一起做'},{t:'若示範人員將手 <span class="accent">舉高</span>，請您加快揉搓速度。',s:'手越高，速度越快'},{t:'若示範人員將手 <span class="accent">放下</span>，請您恢復原速。',s:'回到原本的速度'},{t:'拿到 <span class="accent">紙張</span> 的您，指示代碼為 <span class="accent">B</span>，請您牢記。',s:'B＝紙張'},{t:'請您雙手抓著紙的長邊，跟著示範人員甩動手上的紙張。',s:'雙手抓長邊'},{t:'若示範人員將手 <span class="accent">舉高</span>，請您加快甩動速度。',s:'手越高，速度越快'},{t:'若示範人員將手 <span class="accent">放下</span>，請您恢復原速。',s:'回到原本的速度'},{t:'接下來，請您跟著指示與示範人員練習。',s:'準備進入整體練習'},{t:'請先停下手邊動作，一起發出 <span class="accent">「嘶——」</span> 的聲音。',s:'像海浪一樣，連續吐氣'},{t:'沒氣時，請記得自行換氣。',s:'換好氣，再自然接回來'},{t:'若指示中有您的代碼，請發出道具聲響；如果沒有，請發出 <span class="accent">「嘶——」</span> 的聲響。',s:'看到自己的代碼＝道具聲｜沒有＝嘶聲'},{t:'現在，請大家跟著海浪聲，發出 <span class="accent">「嘶——」</span> 的聲音。',s:'示範練習完成後，進入正式節目'}];
let idx=0,mode='practice';const pScreen=document.getElementById('practiceScreen'),fScreen=document.getElementById('formalScreen'),pText=document.getElementById('practiceText'),pSub=document.getElementById('practiceSub'),pageNo=document.getElementById('pageNo'),progressBar=document.getElementById('progressBar'),progressWrap=document.getElementById('progressWrap'),modeTag=document.getElementById('modeTag'),cue=document.getElementById('cue'),cueName=document.getElementById('cueName'),cueHint=document.getElementById('cueHint'),operator=document.getElementById('operator'),flash=document.getElementById('flash'),rippleLayer=document.getElementById('rippleLayer'),particles=document.getElementById('particles');
function createParticles(){for(let i=0;i<22;i++){const p=document.createElement('span');p.className='particle';const size=3+Math.random()*6;p.style.width=size+'px';p.style.height=size+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=9+Math.random()*8+'s';p.style.animationDelay=-Math.random()*14+'s';p.style.setProperty('--dx',(Math.random()*12-6)+'vw');p.style.opacity=.2+Math.random()*.3;particles.appendChild(p)}}function animatePracticeSwap(){pScreen.classList.remove('swap');void pScreen.offsetWidth;pScreen.classList.add('swap')}function renderPractice(){const item=practice[idx];pText.innerHTML=item.t;pSub.textContent=item.s||'';pageNo.textContent=`${idx+1} / ${practice.length}`;progressBar.style.width=`${(idx+1)/practice.length*100}%`;animatePracticeSwap()}function nextPractice(){if(mode!=='practice'){startPractice();return}if(idx<practice.length-1){idx++;renderPractice()}else startFormal()}function prevPractice(){if(mode!=='practice'){startPractice();return}if(idx>0){idx--;renderPractice()}}function startPractice(){mode='practice';pScreen.classList.add('active');fScreen.classList.remove('active');modeTag.textContent='示範練習';progressWrap.style.visibility='visible';renderPractice()}function startFormal(){mode='formal';pScreen.classList.remove('active');fScreen.classList.add('active');modeTag.textContent='正式節目';progressWrap.style.visibility='hidden';setCue('REST')}function burstRipples(n=2){for(let i=0;i<n;i++){const r=document.createElement('span');r.className='ripple';r.style.animationDelay=`${i*.11}s`;rippleLayer.appendChild(r);setTimeout(()=>r.remove(),1300+i*120)}}function setCue(type){if(mode!=='formal')startFormal();const cfg={A:{big:'A',name:'塑膠袋',hint:'A 發出道具聲｜其他人「嘶——」'},B:{big:'B',name:'紙張',hint:'B 發出道具聲｜其他人「嘶——」'},S:{big:'嘶',name:'全體海浪聲',hint:'一起發出「嘶——」'},AB:{big:'A＋B',name:'兩組一起',hint:'A、B 發出道具聲'},REST:{big:'準備',name:'看指揮・保持安靜',hint:'等待下一個指示'}}[type];cue.textContent=cfg.big;cueName.textContent=cfg.name;cueHint.textContent=cfg.hint;cue.dataset.type=type;cue.classList.remove('pulse');void cue.offsetWidth;cue.classList.add('pulse');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');burstRipples(type==='S'?4:type==='AB'?3:2)}function toggleOperator(){operator.classList.toggle('show')}async function toggleFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}document.addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C'){toggleOperator();return}if(e.key==='f'||e.key==='F'){toggleFullscreen();return}if(e.key==='ArrowRight'){nextPractice();return}if(e.key==='ArrowLeft'){prevPractice();return}if(e.key==='Enter'){startFormal();return}if(e.code==='Space'){e.preventDefault();setCue('REST');return}if(e.key==='a'||e.key==='A'){setCue('A');return}if(e.key==='b'||e.key==='B'){setCue('B');return}if(e.key==='s'||e.key==='S'){setCue('S');return}if(e.key==='x'||e.key==='X'){setCue('AB');return}});document.addEventListener('dblclick',toggleFullscreen);createParticles();renderPractice();operator.classList.add('show');
</script>
</body>
</html>
