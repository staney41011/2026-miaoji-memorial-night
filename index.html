let mode='practice',practiceIndex=0,formalIndex=0;const practiceView=document.getElementById('practiceView'),transitionView=document.getElementById('transitionView'),formalView=document.getElementById('formalView'),practiceCard=document.getElementById('practiceCard'),practiceText=document.getElementById('practiceText'),practiceSub=document.getElementById('practiceSub'),pageNo=document.getElementById('pageNo'),progressFill=document.getElementById('progressFill'),cue=document.getElementById('cue'),rippleLayer=document.getElementById('rippleLayer'),fxLayer=document.getElementById('fxLayer'),flash=document.getElementById('flash'),operator=document.getElementById('operator'),cueList=document.getElementById('cueList'),opCurrent=document.getElementById('opCurrent'),opNext=document.getElementById('opNext');
function showView(el){[practiceView,transitionView,formalView].forEach(v=>{v.classList.remove('active','fade-in')});el.classList.add('active');void el.offsetWidth;el.classList.add('fade-in')}function renderPractice(){const p=practice[practiceIndex];practiceText.innerHTML=p.t;practiceSub.innerHTML=p.s;pageNo.textContent=`${practiceIndex+1} / ${practice.length}`;progressFill.style.width=`${(practiceIndex+1)/practice.length*100}%`;practiceCard.classList.remove('reveal');void practiceCard.offsetWidth;practiceCard.classList.add('reveal');opCurrent.textContent=`示範 ${practiceIndex+1}/${practice.length}`;opNext.textContent=practiceIndex<practice.length-1?'下一則示範':'進入正式節目'}
function makeCueHTML(type){if(type==='A')return '<span class="cue-letter">A</span>';if(type==='B')return '<span class="cue-letter">B</span>';if(type==='AB')return '<span class="cue-letter a">A</span><span class="plus">＋</span><span class="cue-letter b">B</span>';return '<span class="hiss-word">嘶——</span><span class="hiss-line">像海浪一樣延續</span>'}function ripples(n=3){for(let i=0;i<n;i++){const r=document.createElement('span');r.className='ripple';r.style.animationDelay=(i*.12)+'s';rippleLayer.appendChild(r);setTimeout(()=>r.remove(),1500)}}function cueFX(type){fxLayer.innerHTML='';if(type==='A'){for(let i=0;i<13;i++){const e=document.createElement('i');e.className='crinkle';e.style.left='50%';e.style.top='50%';e.style.setProperty('--rot',(Math.random()*180)+'deg');e.style.setProperty('--x',((Math.random()-.5)*72)+'vw');e.style.setProperty('--y',((Math.random()-.5)*52)+'vh');e.style.animationDelay=(Math.random()*.12)+'s';fxLayer.appendChild(e);setTimeout(()=>e.remove(),1300)}}else if(type==='B'){for(let i=0;i<4;i++){const e=document.createElement('i');e.className='paper-wave';e.style.animationDelay=(i*.12)+'s';fxLayer.appendChild(e);setTimeout(()=>e.remove(),1600)}}else if(type==='AB'){cueFX('A');for(let i=0;i<3;i++){const e=document.createElement('i');e.className='paper-wave';e.style.animationDelay=(i*.13)+'s';fxLayer.appendChild(e);setTimeout(()=>e.remove(),1600)}}}function setCue(type,soft=false){cue.dataset.cue=type;cue.innerHTML=makeCueHTML(type);cue.classList.remove('enter');void cue.offsetWidth;cue.classList.add('enter');if(!soft){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');ripples(type==='HISS'?4:type==='AB'?4:3);cueFX(type)}}function renderFormal(){const item=formalSequence[formalIndex];setCue(item.cue);formalView.classList.add('performance');opCurrent.textContent=`${item.code}｜${item.label} → 觀眾：${item.cue==='HISS'?'嘶':item.cue}`;const nxt=formalSequence[formalIndex+1];opNext.textContent=nxt?`${nxt.code}｜${nxt.label}`:'節目結束';renderCueList()}function renderCueList(){cueList.innerHTML=formalSequence.map((x,i)=>`<div class="cue-item ${i===formalIndex&&mode==='formal'?'active':''}" onclick="jumpCue(${i})"><span class="code">${x.code}</span><span>${x.label}</span><span class="aud">${x.cue==='HISS'?'嘶':x.cue}</span></div>`).join('')}function jumpCue(i){mode='formal';formalIndex=i;showView(formalView);renderFormal()}
function goPractice(){mode='practice';showView(practiceView);renderPractice();renderCueList()}function goFormal(){mode='transition';showView(transitionView);opCurrent.textContent='正式節目轉場';opNext.textContent='海浪聲 5 秒＋「嘶」';setTimeout(()=>{if(mode==='transition'){mode='formal';formalIndex=0;showView(formalView);renderFormal()}},2200)}function next(){if(mode==='practice'){if(practiceIndex<practice.length-1){practiceIndex++;renderPractice()}else goFormal();return}if(mode==='transition'){mode='formal';formalIndex=0;showView(formalView);renderFormal();return}if(mode==='formal'&&formalIndex<formalSequence.length-1){formalIndex++;renderFormal()}}function prev(){if(mode==='practice'){if(practiceIndex>0){practiceIndex--;renderPractice()}return}if(mode==='transition'){goPractice();return}if(mode==='formal'){if(formalIndex>0){formalIndex--;renderFormal()}else goPractice()}}function manualCue(type){if(mode!=='formal'){mode='formal';showView(formalView);formalView.classList.add('performance')}setCue(type);opCurrent.textContent=`手動指示｜觀眾：${type==='HISS'?'嘶':type}`;opNext.textContent='可按 → 回到預設順序'}function toggleOperator(){operator.classList.toggle('show')}async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}function createParticles(){const root=document.getElementById('particles');for(let i=0;i<24;i++){const p=document.createElement('span');p.className='particle';const s=3+Math.random()*6;p.style.width=s+'px';p.style.height=s+'px';p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(9+Math.random()*9)+'s';p.style.animationDelay=(-Math.random()*17)+'s';p.style.setProperty('--dx',((Math.random()-.5)*14)+'vw');root.appendChild(p)}}document.addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C'){toggleOperator();return}if(e.key==='f'||e.key==='F'){fullscreen();return}if(e.key==='ArrowRight'){next();return}if(e.key==='ArrowLeft'){prev();return}if(e.key==='Enter'){goFormal();return}if(e.key==='a'||e.key==='A'){manualCue('A');return}if(e.key==='b'||e.key==='B'){manualCue('B');return}if(e.key==='x'||e.key==='X'){manualCue('AB');return}if(e.key==='s'||e.key==='S'){manualCue('HISS');return}});document.addEventListener('dblclick',fullscreen);createParticles();renderPractice();renderCueList();operator.classList.add('show');
</script>
</body>
