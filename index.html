<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2026年妙極大帝紀念晚會｜第二幕指示背板</title>
<style>
:root{--c:#8aeaff;--g:#ffe29a;--w:#f5fcff;--m:#a9cddd;--p:rgba(2,14,26,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b14;color:#fff;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}body{position:relative}.bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(900px 620px at 50% 35%,rgba(70,202,245,.15),transparent 64%),radial-gradient(900px 650px at 8% 8%,rgba(70,145,255,.12),transparent 65%),linear-gradient(155deg,#020a12,#06283f 62%,#073c5b)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.28))}.beam{position:absolute;top:-30vh;width:18vw;height:95vh;border-radius:50%;filter:blur(28px);opacity:.13;background:linear-gradient(rgba(150,239,255,.55),transparent 80%);transform-origin:50% 0}.b1{left:9%;animation:b1 9s ease-in-out infinite alternate}.b2{right:10%;animation:b2 11s ease-in-out infinite alternate}@keyframes b1{from{transform:rotate(-23deg)}to{transform:rotate(-12deg)}}@keyframes b2{from{transform:rotate(22deg)}to{transform:rotate(11deg)}}.wave{position:absolute;left:-12vw;width:124vw;height:18vh;border:2px solid rgba(120,230,255,.18);border-radius:50%}.w1{bottom:16vh;animation:t1 8s ease-in-out infinite alternate}.w2{bottom:6vh;opacity:.55;animation:t2 10s ease-in-out infinite alternate}.w3{bottom:-4vh;opacity:.28;animation:t1 12s ease-in-out infinite alternate-reverse}@keyframes t1{from{transform:translateX(-2vw) rotate(-2deg) scaleY(.85)}to{transform:translateX(3vw) rotate(1deg) scaleY(1.08)}}@keyframes t2{from{transform:translateX(2vw) rotate(1deg)}to{transform:translateX(-3vw) rotate(-1deg) scaleY(.82)}}#particles{position:absolute;inset:0;overflow:hidden}.dot{position:absolute;bottom:-3vh;border-radius:50%;background:rgba(205,247,255,.7);box-shadow:0 0 15px rgba(130,226,255,.55);animation:up linear infinite}@keyframes up{0%{transform:translate(0,0) scale(.5);opacity:0}12%{opacity:.65}100%{transform:translate(var(--dx),-110vh) scale(1.2);opacity:0}}
.view{position:fixed;inset:0;z-index:2;display:none}.view.on{display:grid}.fade{animation:vin .55s ease both}@keyframes vin{from{opacity:0;transform:scale(1.012)}to{opacity:1;transform:none}}
#practice{grid-template-rows:auto 1fr auto;padding:clamp(24px,3.5vw,60px)}.top,.bottom{display:flex;justify-content:space-between;align-items:center;color:#c9e8f4;font-weight:800;letter-spacing:.12em}.badge{padding:8px 15px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.055)}.pmain{display:grid;place-items:center;text-align:center}.card{width:min(1500px,94vw)}.eye{font-size:clamp(18px,2vw,32px);font-weight:900;letter-spacing:.24em;color:var(--c);margin-bottom:28px}.pt{font-size:clamp(34px,5.1vw,82px);line-height:1.35;font-weight:1000;text-wrap:balance;text-shadow:0 8px 34px rgba(0,0,0,.28)}.pt .x{color:var(--g)}.ps{margin-top:24px;color:var(--m);font-size:clamp(17px,1.7vw,29px);font-weight:700}.card.anim .eye{animation:rise .45s ease both}.card.anim .pt{animation:rise .6s .07s ease both}.card.anim .ps{animation:rise .55s .16s ease both}@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}.prog{display:flex;gap:12px;align-items:center}.track{width:min(250px,27vw);height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#42bde8,var(--c));transition:width .3s}
#trans{place-items:center;text-align:center;padding:7vw}.transcopy{font-size:clamp(36px,4.8vw,82px);line-height:1.45;font-weight:1000;text-shadow:0 8px 38px rgba(0,0,0,.36)}.transcopy small{display:block;margin-top:24px;font-size:clamp(18px,1.7vw,30px);letter-spacing:.28em;color:var(--c)}
#formal{place-items:center;text-align:center}.formal{position:relative;width:100%;height:100%;display:grid;place-items:center}.title{position:absolute;top:4vh;left:50%;transform:translateX(-50%);font-size:clamp(13px,1.1vw,18px);letter-spacing:.22em;color:rgba(215,244,255,.34);font-weight:800;transition:opacity .5s}.performance .title{opacity:0}.stage{position:relative;width:min(95vw,1660px);height:min(80vh,900px);display:grid;place-items:center}.aura{position:absolute;width:min(78vmin,900px);height:min(78vmin,900px);border-radius:50%;background:radial-gradient(circle,rgba(92,218,255,.17),rgba(60,165,220,.04) 42%,transparent 69%);animation:aura 4.8s ease-in-out infinite}@keyframes aura{0%,100%{transform:scale(.96);opacity:.68}50%{transform:scale(1.07);opacity:1}}.triad{position:relative;z-index:2;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:clamp(12px,2vw,38px)}.dept{height:min(42vw,390px);position:relative;display:grid;place-items:center}.dept span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.outline,.fill{font-size:clamp(175px,27vw,410px);font-weight:1000;letter-spacing:-.06em}.outline{color:transparent;-webkit-text-stroke:4px rgba(226,248,255,.44);text-shadow:0 0 30px rgba(255,255,255,.04);transition:.35s}.fill{opacity:0;transform:translate(-50%,-50%) translateY(34px) scale(.58);filter:blur(7px);transition:opacity .35s,transform .45s cubic-bezier(.17,.89,.32,1.22),filter .35s}.dept.on .outline{-webkit-text-stroke:4px rgba(245,252,255,.18)}.dept.on .fill{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1);filter:none}.a .fill{color:var(--c);text-shadow:0 0 60px rgba(138,234,255,.42),0 14px 56px rgba(0,0,0,.35)}.h .fill{color:var(--w);text-shadow:0 0 66px rgba(191,243,255,.35),0 14px 56px rgba(0,0,0,.35)}.b .fill{color:var(--g);text-shadow:0 0 60px rgba(255,226,154,.36),0 14px 56px rgba(0,0,0,.35)}.dept.on .fill{animation:glow 2.2s ease-in-out infinite}@keyframes glow{0%,100%{filter:brightness(.92)}50%{filter:brightness(1.18)}}.dept.pop .fill{animation:pop .55s cubic-bezier(.17,.89,.32,1.25),glow 2.2s .55s ease-in-out infinite}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) translateY(40px) scale(.46);filter:blur(9px)}58%{opacity:1;transform:translate(-50%,-50%) translateY(-6px) scale(1.1);filter:none}100%{transform:translate(-50%,-50%) scale(1)}}
.hwaves{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);display:flex;gap:18px;opacity:0;transition:.35s}.hwaves i{width:min(10vw,130px);height:18px;border-top:3px solid rgba(224,246,255,.54);border-radius:50%;animation:hw 1.6s ease-in-out infinite}.hwaves i:nth-child(2){animation-delay:.18s}.hwaves i:nth-child(3){animation-delay:.36s}.hiss .hwaves{opacity:1}@keyframes hw{0%,100%{transform:translateY(0) scaleX(.92);opacity:.3}50%{transform:translateY(-7px) scaleX(1.07);opacity:.95}}
.dyn{position:absolute;top:10%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:clamp(18px,2.5vw,38px);opacity:0;transition:.35s;white-space:nowrap}.dyn span{font-size:clamp(58px,6.5vw,110px);font-weight:1000;color:rgba(247,253,255,.88);text-shadow:0 0 25px rgba(255,255,255,.24)}.swell .dyn{opacity:1}.swell .dyn{animation:dynbreath 4.6s ease-in-out infinite}@keyframes dynbreath{0%,100%{transform:translateX(-50%) scale(.86);opacity:.55}48%{transform:translateX(-50%) scale(1.12);opacity:1}}.swell .a.on .fill,.swell .b.on .fill{animation:swell 4.6s ease-in-out infinite}@keyframes swell{0%{transform:translate(-50%,-50%) scale(.82);filter:brightness(.82)}48%{transform:translate(-50%,-50%) scale(1.18);filter:brightness(1.28)}100%{transform:translate(-50%,-50%) scale(.88);filter:brightness(.88)}}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(132,233,255,.22),transparent 58%)}.flash.go{animation:fl .4s ease}@keyframes fl{0%{opacity:0}38%{opacity:1}100%{opacity:0}}
#op{position:fixed;z-index:20;right:18px;bottom:18px;width:min(500px,94vw);max-height:88vh;overflow:auto;padding:16px;border:1px solid rgba(255,255,255,.13);border-radius:18px;background:var(--p);backdrop-filter:blur(15px);box-shadow:0 18px 60px rgba(0,0,0,.44);display:none}#op.show{display:block}#op h3{margin:0 0 10px}.status{padding:11px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;line-height:1.5}.status b{font-size:16px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}button{border:1px solid rgba(255,255,255,.15);border-radius:11px;background:rgba(255,255,255,.07);color:#fff;padding:9px 11px;font-weight:800;cursor:pointer}button:hover{background:rgba(255,255,255,.13)}.cyan{border-color:rgba(138,234,255,.35)}.gold{border-color:rgba(255,226,154,.35)}.list{margin-top:10px;display:grid;gap:4px}.ci{display:grid;grid-template-columns:48px 1fr 75px;gap:8px;padding:7px 9px;border-radius:9px;color:#b7d6e3;font-size:12px;cursor:pointer}.ci.active{background:rgba(255,255,255,.08);color:#fff}.code{font-weight:900;color:#99e3f6}.aud{text-align:right;font-weight:900}.keys{margin-top:9px;color:#a9cad8;font-size:11px;line-height:1.7}kbd{padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.1)}@media(max-width:820px){.triad{grid-template-columns:1fr;gap:0}.dept{height:20vh}.outline,.fill{font-size:clamp(115px,23vw,220px)}.dyn{top:4%}.hwaves{bottom:3%}}
</style>
</head>
<body>
<div class="bg"><div class="beam b1"></div><div class="beam b2"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div><div id="particles"></div></div><div class="flash" id="flash"></div>
<section class="view on" id="practice"><div class="top"><div>2026年妙極大帝紀念晚會・第二幕</div><div class="badge">示範練習</div></div><div class="pmain"><div class="card anim" id="card"><div class="eye">指示背板</div><div class="pt" id="pt"></div><div class="ps" id="ps"></div></div></div><div class="bottom"><div class="prog"><span id="pn"></span><span class="track"><i id="pf"></i></span></div><div>← → 切換・Enter 正式節目・C 操作台・F 全螢幕</div></div></section>
<section class="view" id="trans"><div class="transcopy">接下來，讓我們一同參與、一同感受，<br>當年陳醫師渡海來台的其中一段歷程。<small>請跟著指揮</small></div></section>
<section class="view" id="formal"><div class="formal"><div class="title">2026年妙極大帝紀念晚會・第二幕</div><div class="stage"><div class="aura"></div><div class="dyn"><span>＜ ＜ ＜</span><span>＞ ＞ ＞</span></div><div class="triad"><div class="dept a" id="da"><span class="outline">A</span><span class="fill">A</span></div><div class="dept h" id="dh"><span class="outline">嘶</span><span class="fill">嘶</span></div><div class="dept b" id="db"><span class="outline">B</span><span class="fill">B</span></div></div><div class="hwaves"><i></i><i></i><i></i></div></div></div></section>
<div id="op"><h3>第二幕｜指揮操作台</h3><div class="status">目前：<b id="cur">示範練習</b><br>下一個：<span id="nxt">—</span></div><div class="row"><button onclick="prev()">← 上一個</button><button class="cyan" onclick="next()">下一個 →</button><button class="gold" onclick="goFormal()">正式節目</button><button onclick="goPractice()">回示範</button></div><div class="row"><button class="cyan" onclick="manual('A')">A＋嘶</button><button onclick="manual('HISS')">嘶</button><button class="gold" onclick="manual('B')">嘶＋B</button><button onclick="manual('AB')">A＋B</button><button onclick="manual('SWELL')">A＋B 漸強漸弱</button></div><div class="list" id="list"></div><div class="keys"><kbd>←</kbd>/<kbd>→</kbd> 上一/下一段　<kbd>A</kbd> A＋嘶　<kbd>S</kbd> 嘶　<kbd>B</kbd> 嘶＋B　<kbd>X</kbd> A+B　<kbd>V</kbd> 漸強漸弱　<kbd>C</kbd> 操作台　<kbd>F</kbd> 全螢幕</div></div>
<script>
const practiceData=[
['現在，請您打開入場時所發的道具。','示範人員出場'],
['拿到<span class="x">塑膠袋</span>的您，指示代碼為<span class="x">Ａ</span>，請您牢記。','Ａ＝塑膠袋'],
['現在請<span class="x">Ａ</span>跟著示範人員之動作，揉搓手上的塑膠袋。','跟著示範人員一起做'],
['若示範人員將手<span class="x">舉高</span>，請您加快揉搓速度。','手越高，速度越快'],
['若示範人員將手<span class="x">放下</span>，請您恢復原速。','回到原本的速度'],
['拿到<span class="x">紙張</span>的您，指示代碼為<span class="x">Ｂ</span>，請您牢記。','Ｂ＝紙張'],
['請您雙手抓著紙的長邊，跟著示範人員甩動手上的紙張。','雙手抓著紙的長邊'],
['若示範人員將手<span class="x">舉高</span>，請您加快甩動速度。','手越高，速度越快'],
['若示範人員將手<span class="x">放下</span>，請您恢復原速。','回到原本的速度'],
['現在，請您跟著指示以及示範人員練習。','Ａ ／ Ｂ ／ Ａ＋Ｂ'],
['做得非常好！',''],
['現在，請您停下手邊動作，一起練習，發出<span class="x">「嘶」</span>的聲音。','沒氣時，請記得自行換氣'],
['非常好，就是這樣。','現在可以先暫停「嘶」的聲音了'],
['接下來整首音樂中，若指示有您的代碼，請發出道具聲響，並跟著示範人員調整速度。','看到自己的代碼＝道具聲'],
['如果指示中<span class="x">沒有</span>屬於您的代碼，請您發出<span class="x">「嘶」</span>的聲音。','沒有自己的代碼＝嘶聲'],
['準備好了嗎？','下一頁進入正式節目']];
const seq=[
['INTRO','海浪聲 5 秒＋「嘶」','HISS'],['A','嘶＋塑膠袋','A'],['B','嘶＋紙','B'],['C','拍腿打擊','HISS'],['C1','拍腿打擊＋塑膠袋＋紙','AB'],['C2','快速連拍＋塑膠袋＋紙','AB'],['D','塑膠袋＋紙（漸強漸弱）','SWELL'],['G','塑膠袋＋紙','AB'],['H','塑膠袋＋紙（漸強漸弱）','SWELL'],['I','拍腿打擊','HISS'],['30','塑膠袋＋紙','AB'],['J','只剩嘴巴「嘶」聲','HISS'],['END','海浪聲＋「嘶」','HISS']];
let mode='practice',pi=0,fi=0;const $=s=>document.querySelector(s),practice=$('#practice'),trans=$('#trans'),formal=$('#formal'),card=$('#card'),pt=$('#pt'),ps=$('#ps'),pn=$('#pn'),pf=$('#pf'),da=$('#da'),dh=$('#dh'),db=$('#db'),flash=$('#flash'),op=$('#op'),cur=$('#cur'),nxt=$('#nxt'),list=$('#list');
function show(v){[practice,trans,formal].forEach(x=>x.classList.remove('on','fade'));v.classList.add('on');void v.offsetWidth;v.classList.add('fade')}
function renderPractice(){pt.innerHTML=practiceData[pi][0];ps.innerHTML=practiceData[pi][1];pn.textContent=`${pi+1} / ${practiceData.length}`;pf.style.width=`${(pi+1)/practiceData.length*100}%`;card.classList.remove('anim');void card.offsetWidth;card.classList.add('anim');cur.textContent=`示範 ${pi+1}/${practiceData.length}`;nxt.textContent=pi<practiceData.length-1?'下一則示範':'進入正式節目'}
function state(s){formal.classList.remove('hiss','swell');[da,dh,db].forEach(x=>x.classList.remove('on','pop'));let a=[];if(s==='HISS'){a=[dh];formal.classList.add('hiss')}if(s==='A'){a=[da,dh];formal.classList.add('hiss')}if(s==='B'){a=[dh,db];formal.classList.add('hiss')}if(s==='AB')a=[da,db];if(s==='SWELL'){a=[da,db];formal.classList.add('swell')}a.forEach(x=>{x.classList.add('on');void x.offsetWidth;x.classList.add('pop')});flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
function aud(s){return s==='HISS'?'嘶':s==='A'?'A＋嘶':s==='B'?'嘶＋B':s==='SWELL'?'A＋B ↕':s}
function renderList(){list.innerHTML=seq.map((x,i)=>`<div class="ci ${mode==='formal'&&i===fi?'active':''}" onclick="jump(${i})"><span class="code">${x[0]}</span><span>${x[1]}</span><span class="aud">${aud(x[2])}</span></div>`).join('')}
function renderFormal(){let x=seq[fi];state(x[2]);formal.classList.add('performance');cur.textContent=`${x[0]}｜${x[1]}`;nxt.textContent=seq[fi+1]?`${seq[fi+1][0]}｜${seq[fi+1][1]}`:'節目結束';renderList()}
function jump(i){mode='formal';fi=i;show(formal);renderFormal()}
function goPractice(){mode='practice';show(practice);renderPractice();renderList()}
function goFormal(){mode='transition';show(trans);cur.textContent='正式節目轉場';nxt.textContent='海浪聲＋「嘶」';setTimeout(()=>{if(mode==='transition'){mode='formal';fi=0;show(formal);renderFormal()}},2200)}
function next(){if(mode==='practice'){if(pi<practiceData.length-1){pi++;renderPractice()}else goFormal();return}if(mode==='transition'){mode='formal';fi=0;show(formal);renderFormal();return}if(fi<seq.length-1){fi++;renderFormal()}}
function prev(){if(mode==='practice'){if(pi>0){pi--;renderPractice()}return}if(mode==='transition'){goPractice();return}if(fi>0){fi--;renderFormal()}else goPractice()}
function manual(s){if(mode!=='formal'){mode='formal';show(formal);formal.classList.add('performance')}state(s);cur.textContent=`手動｜${aud(s)}`;nxt.textContent='按 → 回預設順序'}
function toggleOp(){op.classList.toggle('show')}async function fs(){try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key==='Enter')goFormal();else if(/[cC]/.test(e.key))toggleOp();else if(/[fF]/.test(e.key))fs();else if(/[aA]/.test(e.key))manual('A');else if(/[sS]/.test(e.key))manual('HISS');else if(/[bB]/.test(e.key))manual('B');else if(/[xX]/.test(e.key))manual('AB');else if(/[vV]/.test(e.key))manual('SWELL')});document.addEventListener('dblclick',fs);
for(let i=0;i<22;i++){let d=document.createElement('i');d.className='dot';let z=3+Math.random()*6;d.style.width=d.style.height=z+'px';d.style.left=Math.random()*100+'vw';d.style.animationDuration=9+Math.random()*9+'s';d.style.animationDelay=-Math.random()*17+'s';d.style.setProperty('--dx',(Math.random()-.5)*14+'vw');$('#particles').appendChild(d)}renderPractice();renderList();op.classList.add('show');
</script>
</body></html>
