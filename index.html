<title>2026年妙極大帝紀念晚會｜第二幕指示背板</title>
<style>
:root{--bg:#041321;--bg2:#0a3552;--a:#95f2ff;--b:#f4efad;--w:#f7fbff;--m:#b8d7e8;--p:rgba(6,20,36,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--w);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}body{position:relative}
.bg{position:fixed;inset:0;background:radial-gradient(900px 520px at 50% 38%,rgba(88,219,255,.14),transparent 60%),radial-gradient(900px 700px at 0 0,rgba(75,161,255,.12),transparent 55%),linear-gradient(160deg,#020b14,#08304d 70%,#0b4466)}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.3))}.wave{position:absolute;left:-10vw;width:120vw;height:18vh;border:2px solid rgba(149,242,255,.18);border-radius:50%}.wave:nth-child(1){bottom:18vh;animation:t1 8s ease-in-out infinite alternate}.wave:nth-child(2){bottom:9vh;opacity:.6;animation:t2 10s ease-in-out infinite alternate}.wave:nth-child(3){bottom:0;opacity:.35;animation:t1 12s ease-in-out infinite alternate-reverse}.beam{position:absolute;top:-25vh;width:18vw;height:90vh;border-radius:50%;filter:blur(24px);background:linear-gradient(180deg,rgba(164,240,255,.45),transparent 85%);opacity:.12}.beam.a{left:8%;transform:rotate(-18deg)}.beam.b{right:10%;transform:rotate(18deg)}@keyframes t1{from{transform:translateX(-2vw) scaleY(.86)}to{transform:translateX(3vw) scaleY(1.08)}}@keyframes t2{from{transform:translateX(3vw)}to{transform:translateX(-3vw) scaleY(.84)}}
#particles{position:absolute;inset:0;pointer-events:none}.pt{position:absolute;bottom:-4vh;border-radius:50%;background:rgba(211,247,255,.7);box-shadow:0 0 14px rgba(120,223,255,.45);animation:up linear infinite}@keyframes up{0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}12%{opacity:.8}100%{opacity:0;transform:translate3d(var(--dx),-110vh,0) scale(1.1)}}
.view{position:fixed;inset:0;display:none;z-index:2}.view.on{display:grid}.fade{animation:fade .55s ease both}@keyframes fade{from{opacity:0;transform:scale(1.01)}to{opacity:1;transform:none}}
#practice{grid-template-rows:auto 1fr auto;padding:28px 42px}.top{display:flex;justify-content:space-between;align-items:center;color:#cfeeff;font-weight:800;letter-spacing:.14em}.tag{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}.center{display:grid;place-items:center;text-align:center}.card{width:min(1500px,94vw)}.eyebrow{font-size:clamp(18px,2vw,30px);letter-spacing:.25em;font-weight:900;color:var(--a);margin-bottom:20px}.big{font-size:clamp(34px,5.1vw,82px);line-height:1.35;font-weight:1000;text-wrap:balance;text-shadow:0 8px 30px rgba(0,0,0,.25)}.big .x{color:#ffe29c}.sub{margin-top:18px;font-size:clamp(16px,1.7vw,28px);color:var(--m);font-weight:700}.bottom{display:flex;justify-content:space-between;align-items:center;color:rgba(228,245,255,.6);font-size:clamp(12px,1vw,16px)}.prog{display:flex;align-items:center;gap:12px}.bar{width:min(250px,28vw);height:5px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#44c3eb,var(--a));transition:width .35s ease}
#transition{place-items:center;padding:6vw;text-align:center}.tran{font-size:clamp(36px,4.8vw,82px);line-height:1.45;font-weight:1000;text-shadow:0 8px 36px rgba(0,0,0,.35)}.tran small{display:block;margin-top:18px;font-size:clamp(18px,1.6vw,28px);letter-spacing:.24em;color:#d7f4ff}
#formal{place-items:center;text-align:center}.title{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:.24em;color:rgba(213,244,255,.35);font-weight:800;transition:opacity .5s}.hideTitle .title{opacity:0}.stage{position:relative;width:min(94vw,1600px);height:min(78vh,860px);display:grid;place-items:center}.aura{position:absolute;width:min(74vmin,860px);height:min(74vmin,860px);border-radius:50%;background:radial-gradient(circle,rgba(95,220,255,.16),rgba(95,220,255,.03) 45%,transparent 68%);animation:aura 4.5s ease-in-out infinite}@keyframes aura{0%,100%{transform:scale(.96);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.triad{position:relative;z-index:2;width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:clamp(16px,2vw,38px)}.dept{position:relative;height:min(42vw,360px);display:grid;place-items:center}.dept span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.outline{color:transparent;-webkit-text-stroke:4px rgba(230,247,255,.44);opacity:.95;text-shadow:0 0 25px rgba(255,255,255,.03)}.fill{opacity:0;transform:translate(-50%,-50%) translateY(24px) scale(.7);filter:blur(6px);transition:opacity .3s ease,transform .35s cubic-bezier(.17,.89,.32,1.2),filter .35s ease}.dept.active .fill{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}.dept.active .outline{-webkit-text-stroke:4px rgba(255,255,255,.2)}.dept.pop .fill{animation:pop .5s cubic-bezier(.17,.89,.32,1.2)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) translateY(24px) scale(.6)}60%{opacity:1;transform:translate(-50%,-50%) translateY(-4px) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}
.deptA .outline,.deptA .fill,.deptB .outline,.deptB .fill{font-size:clamp(170px,26vw,380px);font-weight:1000;letter-spacing:-.06em}.deptH .outline,.deptH .fill{font-size:clamp(118px,16vw,230px);font-weight:1000;letter-spacing:.02em}.deptA .fill{color:var(--a);text-shadow:0 0 36px rgba(149,242,255,.32),0 12px 50px rgba(0,0,0,.35);animation:ga 2.2s ease-in-out infinite}.deptB .fill{color:var(--b);text-shadow:0 0 36px rgba(244,239,173,.28),0 12px 50px rgba(0,0,0,.35);animation:gb 2.4s ease-in-out infinite}.deptH .fill{color:#f3fbff;text-shadow:0 0 42px rgba(210,246,255,.34),0 12px 50px rgba(0,0,0,.35);animation:gh 2.2s ease-in-out infinite}.deptH .outline{-webkit-text-stroke:3px rgba(230,247,255,.38)}@keyframes ga{0%,100%{text-shadow:0 0 28px rgba(149,242,255,.28),0 12px 50px rgba(0,0,0,.35)}50%{text-shadow:0 0 68px rgba(149,242,255,.5),0 12px 50px rgba(0,0,0,.35)}}@keyframes gb{0%,100%{text-shadow:0 0 28px rgba(244,239,173,.24),0 12px 50px rgba(0,0,0,.35)}50%{text-shadow:0 0 68px rgba(244,239,173,.44),0 12px 50px rgba(0,0,0,.35)}}@keyframes gh{0%,100%{transform:translate(-50%,-50%) scale(.98)}50%{transform:translate(-50%,-50%) scale(1.04)}}
.hissW{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);display:flex;gap:16px;opacity:0;transition:opacity .3s}.hissW i{display:block;width:min(9vw,110px);height:16px;border-top:3px solid rgba(228,246,255,.56);border-radius:50%;animation:hw 1.5s ease-in-out infinite}.hissW i:nth-child(2){animation-delay:.18s}.hissW i:nth-child(3){animation-delay:.36s}@keyframes hw{0%,100%{opacity:.35;transform:translateY(0) scaleX(.94)}50%{opacity:.95;transform:translateY(-6px) scaleX(1.06)}}.hissMode .hissW{opacity:1}
.rip{position:absolute;left:50%;top:50%;width:30vmin;height:30vmin;border:2px solid rgba(145,239,255,.46);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:r 1.1s ease-out forwards}.fx{position:absolute;inset:0;pointer-events:none}.ck{position:absolute;width:8px;height:60px;border-radius:999px;background:linear-gradient(180deg,rgba(149,242,255,0),rgba(149,242,255,.8),rgba(149,242,255,0));animation:ck .9s ease-out forwards}.pw{position:absolute;left:76%;top:50%;width:min(54vw,860px);height:12px;border-top:2px solid rgba(244,239,173,.62);border-radius:50%;transform:translate(-50%,-50%) scaleX(.2);animation:pw 1.1s ease-out forwards}@keyframes r{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3)}}@keyframes ck{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.2)}30%{opacity:.9}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--rot) + 45deg)) scale(1.2)}}@keyframes pw{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.2) scaleY(.6)}25%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scaleX(1.2) scaleY(4)}}.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,rgba(123,230,255,.22),transparent 56%);opacity:0;z-index:3}.flash.on{animation:f .42s ease}@keyframes f{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.dyn{position:absolute;left:50%;top:12%;transform:translateX(-50%);display:grid;gap:8px;place-items:center;opacity:0;transition:opacity .3s}.dyn .t{font-size:clamp(22px,2vw,36px);font-weight:900;letter-spacing:.25em;color:rgba(247,251,255,.95)}.dyn .s{font-size:clamp(15px,1.1vw,20px);font-weight:800;letter-spacing:.18em;color:rgba(214,244,255,.64)}.swellMode .dyn,.swellMode .cap{opacity:1}.cap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:clamp(18px,1.5vw,26px);font-weight:800;letter-spacing:.18em;color:rgba(224,246,255,.7);opacity:0;transition:opacity .3s}.swellOnce .deptA.active .fill,.swellOnce .deptB.active .fill{animation:swell 3.6s ease-in-out 1}@keyframes swell{0%{transform:translate(-50%,-50%) scale(.92)}45%{transform:translate(-50%,-50%) scale(1.16)}100%{transform:translate(-50%,-50%) scale(.92)}}.swellOnce .dyn .t{animation:swTxt 3.6s ease-in-out 1}@keyframes swTxt{0%{transform:scale(.98);opacity:.8}45%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:.84}}
#op{position:fixed;right:18px;bottom:18px;z-index:10;width:min(500px,94vw);padding:16px;border-radius:18px;background:var(--p);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);box-shadow:0 16px 40px rgba(0,0,0,.35);display:none}#op.show{display:block}#op h3{margin:0 0 10px;font-size:17px;color:#e3f7ff}.st{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#cae8f6;margin-bottom:8px}.st b{color:#fff}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}button:hover{background:rgba(255,255,255,.13)}.c{background:rgba(68,195,235,.16);border-color:rgba(68,195,235,.38)}.g{background:rgba(244,239,173,.12);border-color:rgba(244,239,173,.3)}.list{margin-top:12px;max-height:250px;overflow:auto}.item{display:grid;grid-template-columns:54px 1fr 94px;gap:10px;padding:8px 10px;border-radius:12px;color:#def3fb;font-size:13px;cursor:pointer}.item .a{text-align:right;color:#fff;font-weight:800}.item .cde{color:#97dff2;font-weight:900}.item.on{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}.help{margin-top:10px;font-size:12px;line-height:1.7;color:#b7d9ea}kbd{padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
@media (max-width:820px){#practice{padding:20px}.triad{grid-template-columns:1fr;gap:2vh}.dept{height:20vh}.deptA .outline,.deptA .fill,.deptB .outline,.deptB .fill{font-size:clamp(120px,23vw,220px)}.deptH .outline,.deptH .fill{font-size:clamp(92px,14vw,160px)}.hissW{bottom:7%}}
</style>

<body>
<div class="bg"><div class="beam a"></div><div class="beam b"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div><div id="particles"></div></div><div class="flash" id="flash"></div>
<section class="view on" id="practice"><div class="top"><div>2026年妙極大帝紀念晚會・第二幕</div><div class="tag">示範練習</div></div><div class="center"><div class="card" id="pcard"><div class="eyebrow">指示背板</div><div class="big" id="pt"></div><div class="sub" id="ps"></div></div></div><div class="bottom"><div class="prog"><span id="pn"></span><span class="bar"><i id="pf"></i></span></div><div>← → 切換・Enter 正式節目・C 操作台・F 全螢幕</div></div></section>
<section class="view" id="transition"><div class="tran">接下來，讓我們一同參與、一同感受，<br>當年陳醫師渡海來台的其中一段歷程。<small>請跟著指揮</small></div></section>
<section class="view" id="formal"><div class="title">2026年妙極大帝紀念晚會・第二幕</div><div class="stage"><div class="aura"></div><div class="fx" id="fx"></div><div class="dyn"><div class="t">漸強　→　漸弱</div><div class="s">聲音與動作由小到大，再慢慢收回</div></div><div class="triad"><div class="dept deptA" id="dA"><span class="outline">A</span><span class="fill">A</span></div><div class="dept deptH" id="dH"><span class="outline">嘶</span><span class="fill">嘶</span></div><div class="dept deptB" id="dB"><span class="outline">B</span><span class="fill">B</span></div></div><div class="hissW"><i></i><i></i><i></i></div><div class="cap">漸強　→　漸弱</div></div></section>
<div id="op"><h3>第二幕｜指揮操作台</h3><div class="st"><div>目前：<b id="cur">示範練習</b></div><div>下一個：<span id="nxt">—</span></div></div><div class="row"><button onclick="prev()">← 上一個</button><button class="c" onclick="next()">下一個 →</button><button class="g" onclick="goFormal()">正式節目</button><button onclick="goPractice()">回示範</button></div><div class="row"><button class="c" onclick="manual('A')">A＋嘶</button><button onclick="manual('HISS')">嘶</button><button class="g" onclick="manual('B')">嘶＋B</button><button onclick="manual('AB')">A＋B</button><button onclick="manual('SWELL')">A＋B 漸強漸弱</button></div><div class="list" id="list"></div><div class="help"><kbd>←</kbd>/<kbd>→</kbd> 上一/下一段　<kbd>A</kbd> A＋嘶　<kbd>S</kbd> 嘶　<kbd>B</kbd> 嘶＋B　<kbd>X</kbd> A+B　<kbd>V</kbd> 漸強漸弱　<kbd>C</kbd> 操作台　<kbd>F</kbd> 全螢幕</div></div>
<script>
const practice=[['現在，請您打開入場時所發的道具。','示範人員出場'],['拿到<span class="x">塑膠袋</span>的您，指示代碼為<span class="x">Ａ</span>，請您牢記。','Ａ＝塑膠袋'],['現在請<span class="x">Ａ</span>跟著示範人員之動作，揉搓手上的塑膠袋。','跟著示範人員一起做'],['若示範人員將手<span class="x">舉高</span>，請您加快揉搓速度。','手越高，速度越快'],['若示範人員將手<span class="x">放下</span>，請您恢復原速。','回到原本的速度'],['拿到<span class="x">紙張</span>的您，指示代碼為<span class="x">Ｂ</span>，請您牢記。','Ｂ＝紙張'],['請您雙手抓著紙的長邊，跟著示範人員甩動手上的紙張。','雙手抓著紙的長邊'],['若示範人員將手<span class="x">舉高</span>，請您加快甩動速度。','手越高，速度越快'],['若示範人員將手<span class="x">放下</span>，請您恢復原速。','回到原本的速度'],['現在，請您跟著指示以及示範人員練習。','Ａ ／ Ｂ ／ Ａ＋Ｂ'],['做得非常好！',''],['現在，請您停下手邊動作，一起練習，發出<span class="x">「嘶」</span>的聲音。','沒氣時，請記得自行換氣'],['非常好，就是這樣。','現在可以先暫停「嘶」的聲音了'],['接下來整首音樂中，若指示有您的代碼，請發出道具聲響，並跟著示範人員調整速度。','看到自己的代碼＝道具聲'],['如果指示中<span class="x">沒有</span>屬於您的代碼，請您發出<span class="x">「嘶」</span>的聲音。','沒有自己的代碼＝嘶聲'],['準備好了嗎？','下一頁進入正式節目']];
const seq=[['INTRO','海浪聲 5 秒＋「嘶」','HISS'],['A','塑膠袋＋嘶','A'],['B','紙＋嘶','B'],['C','拍腿打擊','HISS'],['C1','拍腿打擊＋塑膠袋＋紙','AB'],['C2','快速連拍＋塑膠袋＋紙','AB'],['D','塑膠袋＋紙（漸強漸弱）','SWELL'],['G','塑膠袋＋紙','AB'],['H','塑膠袋＋紙（漸強漸弱）','SWELL'],['I','拍腿打擊','HISS'],['30','塑膠袋＋紙','AB'],['J','只剩嘴巴「嘶」聲','HISS'],['END','海浪聲＋「嘶」','HISS']];
let mode='practice',pi=0,fi=0;const V={practice:document.getElementById('practice'),transition:document.getElementById('transition'),formal:document.getElementById('formal')};const pcard=document.getElementById('pcard'),pt=document.getElementById('pt'),ps=document.getElementById('ps'),pn=document.getElementById('pn'),pf=document.getElementById('pf'),fx=document.getElementById('fx'),flash=document.getElementById('flash'),op=document.getElementById('op'),cur=document.getElementById('cur'),nxt=document.getElementById('nxt'),list=document.getElementById('list'),dA=document.getElementById('dA'),dH=document.getElementById('dH'),dB=document.getElementById('dB'),formal=document.getElementById('formal');
function show(v){Object.values(V).forEach(x=>x.classList.remove('on','fade'));v.classList.add('on');void v.offsetWidth;v.classList.add('fade')}
function renderPractice(){const p=practice[pi];pt.innerHTML=p[0];ps.innerHTML=p[1];pn.textContent=`${pi+1} / ${practice.length}`;pf.style.width=`${(pi+1)/practice.length*100}%`;pcard.classList.remove('fade');void pcard.offsetWidth;pcard.classList.add('fade');cur.textContent=`示範 ${pi+1}/${practice.length}`;nxt.textContent=pi<practice.length-1?'下一則示範':'進入正式節目'}
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}function clearModes(){formal.classList.remove('hissMode','swellMode','swellOnce','hideTitle');[dA,dH,dB].forEach(x=>x.classList.remove('active','pop'))}
function ripples(n){for(let i=0;i<n;i++){const r=document.createElement('i');r.className='rip';r.style.animationDelay=(i*.1)+'s';fx.appendChild(r);setTimeout(()=>r.remove(),1300)}}
function waveFX(type){fx.querySelectorAll('.ck,.pw').forEach(e=>e.remove());if(type==='A'||type==='AB'||type==='SWELL'){for(let i=0;i<10;i++){const e=document.createElement('i');e.className='ck';e.style.left='24%';e.style.top='50%';e.style.setProperty('--rot',Math.random()*180+'deg');e.style.setProperty('--x',((Math.random()-.2)*40)+'vw');e.style.setProperty('--y',((Math.random()-.5)*36)+'vh');fx.appendChild(e);setTimeout(()=>e.remove(),1100)}}if(type==='B'||type==='AB'||type==='SWELL'){for(let i=0;i<3;i++){const e=document.createElement('i');e.className='pw';e.style.animationDelay=(i*.14)+'s';fx.appendChild(e);setTimeout(()=>e.remove(),1300)}}}
function apply(state,manual=false){clearModes();let on=[];if(state==='A'){on=[dA,dH];formal.classList.add('hissMode')}else if(state==='B'){on=[dH,dB];formal.classList.add('hissMode')}else if(state==='AB'){on=[dA,dB]}else if(state==='HISS'){on=[dH];formal.classList.add('hissMode')}else if(state==='SWELL'){on=[dA,dB];formal.classList.add('swellMode')}on.forEach(el=>{el.classList.add('active');pop(el)});formal.classList.add('hideTitle');if(state==='SWELL'){void formal.offsetWidth;formal.classList.add('swellOnce')}flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');ripples(state==='SWELL'?5:state==='HISS'?4:3);waveFX(state)}
function renderFormal(){const s=seq[fi];apply(s[2]);cur.textContent=`${s[0]}｜${s[1]}`;nxt.textContent=seq[fi+1]?`${seq[fi+1][0]}｜${seq[fi+1][1]}`:'節目結束';renderList()}
function aud(st){return st==='A'?'A＋嘶':st==='B'?'嘶＋B':st==='AB'?'A＋B':st==='SWELL'?'漸強漸弱':'嘶'}
function renderList(){list.innerHTML=seq.map((s,i)=>`<div class="item ${mode==='formal'&&i===fi?'on':''}" onclick="jump(${i})"><span class="cde">${s[0]}</span><span>${s[1]}</span><span class="a">${aud(s[2])}</span></div>`).join('')}
function jump(i){mode='formal';fi=i;show(V.formal);renderFormal()}function goPractice(){mode='practice';show(V.practice);renderPractice();renderList()}function goFormal(){mode='transition';show(V.transition);cur.textContent='正式節目轉場';nxt.textContent='海浪聲 5 秒＋「嘶」';setTimeout(()=>{if(mode==='transition'){mode='formal';fi=0;show(V.formal);renderFormal()}},2200)}function next(){if(mode==='practice'){pi<practice.length-1?pi++:goFormal();renderPractice();return}if(mode==='transition'){mode='formal';fi=0;show(V.formal);renderFormal();return}if(mode==='formal'&&fi<seq.length-1){fi++;renderFormal()}}function prev(){if(mode==='practice'){if(pi>0){pi--;renderPractice()}return}if(mode==='transition'){goPractice();return}if(mode==='formal'){if(fi>0){fi--;renderFormal()}else goPractice()}}function manual(s){mode='formal';show(V.formal);apply(s,true);cur.textContent=`手動指示｜${aud(s)}`;nxt.textContent='可按 → 回到預設順序'}function toggleOp(){op.classList.toggle('show')}async function fs(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C')return toggleOp();if(e.key==='f'||e.key==='F')return fs();if(e.key==='ArrowRight')return next();if(e.key==='ArrowLeft')return prev();if(e.key==='Enter')return goFormal();if(e.key==='a'||e.key==='A')return manual('A');if(e.key==='s'||e.key==='S')return manual('HISS');if(e.key==='b'||e.key==='B')return manual('B');if(e.key==='x'||e.key==='X')return manual('AB');if(e.key==='v'||e.key==='V')return manual('SWELL')});document.addEventListener('dblclick',fs);
(function(){for(let i=0;i<22;i++){const p=document.createElement('span');p.className='pt';const s=3+Math.random()*6;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=9+Math.random()*8+'s';p.style.animationDelay=-Math.random()*14+'s';p.style.setProperty('--dx',(Math.random()*12-6)+'vw');document.getElementById('particles').appendChild(p)}})();renderPractice();renderList();op.classList.add('show');
</script>
</body>
</html>
